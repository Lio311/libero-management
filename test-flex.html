<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; }
  main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #eee; }
  .wrapper { background: #ccc; min-height: 100vh; display: flex; flex-direction: column; }
  .sticky-top { position: sticky; top: 0; background: yellow; padding: 20px; z-index: 60; }
  .content { height: 2000px; background: linear-gradient(red, blue); }
</style>
</head>
<body>
  <main>
    <div class="wrapper" id="wrapper">
      <div class="sticky-top">Sticky Header</div>
      <div class="content"></div>
    </div>
  </main>
  <script>
    setTimeout(() => {
      console.log("Wrapper height:", document.getElementById("wrapper").offsetHeight);
    }, 1000);
  </script>
</body>
</html>

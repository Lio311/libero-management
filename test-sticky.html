<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; }
  main { flex: 1; overflow-y: auto; background: #eee; }
  .content-wrapper { min-height: 100vh; display: flex; flex-direction: column; }
  .header { height: 200px; background: pink; }
  .sticky-top { position: sticky; top: 0; background: yellow; padding: 20px; z-index: 60; }
  .main-content { padding: 20px; }
  .card { background: white; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 60px; background: lightblue; padding: 10px; z-index: 40; }
  td { padding: 50px 10px; border-bottom: 1px solid #ccc; }
</style>
</head>
<body>
  <aside style="width: 200px; background: #333;"></aside>
  <main>
    <div class="content-wrapper">
      <div class="header">Header (Not sticky)</div>
      <div class="sticky-top">Sticky Filters</div>
      <div class="main-content">
        <div class="card">
          <table>
            <thead>
              <tr><th>Col 1</th><th>Col 2</th></tr>
            </thead>
            <tbody>
              <tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr><tr><td>Data</td><td>Data</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
